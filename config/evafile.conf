# EvaFile Configuration File
# Location: ~/.config/evafile/evafile.conf

[General]
theme = crimson_flame
show_hidden = false
default_view_mode = details
icon_size = 64
confirm_delete = true
restore_tabs_on_startup = true

[Layout]
show_sidebar = true
show_preview = false
show_split = false
sidebar_width = 220
preview_width = 300
window_width = 1100
window_height = 700

[Shortcuts]
open_terminal = F4
toggle_split = F3
toggle_preview = F11
toggle_hidden = Ctrl+H
focus_location = Ctrl+L
search = Ctrl+F
new_tab = Ctrl+T
close_tab = Ctrl+W
reload = F5
